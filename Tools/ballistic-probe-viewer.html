<!doctype html><html lang="zh"><meta charset="utf-8"><title>密位双探针侧视回放</title>
<style>body{background:#11151d;color:#e9edf6;font:16px system-ui;margin:24px}input,button,select{margin:8px;padding:8px}svg{background:#191f2b;width:100%;height:540px}pre{white-space:pre-wrap;color:#bbc7de}#seek{width:65%}label{display:inline-block}strong{color:#bd8fff}</style>
<h2>密位双探针 · 实测侧视回放</h2><p>选择游戏生成的 probe-*.jsonl。横纵轴分别缩放；侧视重合不代表三维相交。这里不生成或补造实测数据。</p>
<input id="file" type="file" accept=".jsonl"><button id="play">播放 / 暂停</button><select id="phase"><option value="optic-pre-render">镜内黄线探针</option><option value="main-GUI">主视野黄线探针</option></select><br>
<input id="seek" type="range" min="0" max="0" value="0"><label>前向范围 <select id="range"><option value="100">100 m</option><option value="500">500 m</option><option value="1000">1000 m</option><option value="2000">2000 m</option></select></label>
<p id="status">等待记录文件</p><svg id="plot" viewBox="0 0 1100 540"></svg><pre id="details"></pre>
<script>
let rows=[],refs=[],shots=[],playing=false;
const $=id=>document.getElementById(id),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),sub=(a,b)=>a.map((x,i)=>x-b[i]),norm=a=>{let n=Math.hypot(...a);return a.map(x=>x/(n||1))};
$('file').onchange=async()=>{rows=[];let errors=0;for(const line of (await $('file').files[0].text()).split(/\r?\n/)){if(!line.trim())continue;try{rows.push(JSON.parse(line))}catch{errors++}}refs=rows.filter(r=>r.kind==='reference');shots=rows.filter(r=>r.kind==='trajectory');$('seek').max=Math.max(0,refs.length-1);$('seek').value=0;draw();if(errors)$('details').textContent+='\n跳过不完整记录：'+errors};
function draw(){let r=refs[+$('seek').value];if(!r){$('status').textContent='没有紫线探针记录，请在瞄准状态调整密位后重试。';return}let candidates=shots.filter(s=>s.phase===$('phase').value),s=candidates.reduce((a,b)=>!a||Math.abs(b.frame-r.frame)<Math.abs(a.frame-r.frame)?b:a,null);$('status').textContent=`记录 ${+$('seek').value+1}/${refs.length} · ${r.mrad.toFixed(4)} mrad · ${r.status}`;
if(!s){$('details').textContent='没有对应黄线探针；请开启弹道调试。紫线记录帧：'+r.frame;return}
let base=s.muzzle,up=[0,1,0],forward=norm([s.direction[0],0,s.direction[2]]),side=p=>[dot(sub(p,base),forward),dot(sub(p,base),up)],maxX=+$('range').value,origin=side(r.origin),rx=dot(r.axis,forward),ry=dot(r.axis,up),rayY=x=>origin[1]+(x-origin[0])*ry/(Math.abs(rx)>1e-8?rx:1e-8),theory=(r.theory||[]).map(side),solid=(s.path||[]).map(side),visible=theory.filter(p=>p[0]>=0&&p[0]<=maxX),ys=visible.map(p=>p[1]).concat([0,origin[1],rayY(0),rayY(maxX)]),lo=Math.min(...ys),hi=Math.max(...ys),pad=Math.max(.01,(hi-lo)*.08);lo-=pad;hi+=pad;
let X=x=>75+x/maxX*990,Y=y=>465-(y-lo)/(hi-lo)*420,path=p=>p.map((a,i)=>(i?'L':'M')+X(a[0]).toFixed(2)+','+Y(a[1]).toFixed(2)).join(' '),svg=$('plot');svg.innerHTML='<defs><clipPath id="clip"><rect x="75" y="45" width="990" height="420"/></clipPath></defs>';
let ns='http://www.w3.org/2000/svg',add=(tag,attrs,text)=>{let e=document.createElementNS(ns,tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(text)e.textContent=text;svg.append(e);return e};
for(let i=0;i<=5;i++){let x=i*maxX/5,y=lo+(hi-lo)*i/5;add('line',{x1:X(x),x2:X(x),y1:45,y2:465,stroke:'#354055'});add('line',{x1:75,x2:1065,y1:Y(y),y2:Y(y),stroke:'#354055'});add('text',{x:X(x),y:490,fill:'#bfcbe1','font-size':14},x.toFixed(0)+' m');add('text',{x:2,y:Y(y),fill:'#bfcbe1','font-size':13},y.toFixed(3))}
add('path',{d:path(theory),fill:'none',stroke:'#d4ba46','stroke-dasharray':'6 5','stroke-width':2,'clip-path':'url(#clip)'});add('path',{d:path(solid),fill:'none',stroke:'#ffff00','stroke-width':3,'clip-path':'url(#clip)'});add('path',{d:path([[0,rayY(0)],[maxX,rayY(maxX)]]),fill:'none',stroke:'#ca8fff','stroke-width':2,'clip-path':'url(#clip)'});
for(let h of r.crossings||[]){let p=side(h);add('circle',{cx:X(p[0]),cy:Y(p[1]),r:5,fill:'#55ff75','clip-path':'url(#clip)'})}
let hits=(r.crossings||[]).map(p=>Math.hypot(...sub(p,base))).sort((a,b)=>a-b),fmt=x=>x===undefined?'—':x<50?'< 50 m':x.toFixed(1)+' m';
add('text',{x:80,y:525,fill:'#f3f5fb','font-size':16},'黄实线：碰撞预测；黄虚线：理论延长；紫线：求交射线；绿点：三维有效交点。');
$('details').textContent=`黄线帧 ${s.frame} / 紫线帧 ${r.frame} / 相差 ${s.frame-r.frame} 帧（不同帧不会冒充同步）\n近交点：${fmt(hits[0])}；远交点：${fmt(hits.length>1?hits[hits.length-1]:undefined)}\n枪口 ${JSON.stringify(s.rawMuzzle)}\n预测起点 ${JSON.stringify(s.muzzle)}\n紫线起点 ${JSON.stringify(r.origin)}\n紫线方向 ${JSON.stringify(r.axis)}\n相对原生节点位移 ${JSON.stringify(sub(r.origin,r.nativeOrigin))}\n垂直候选及横向偏差（米）：\n${JSON.stringify(r.candidates,null,2)}\n本帧遮罩记录：${JSON.stringify(rows.filter(x=>x.kind==='overlay'&&Math.abs(x.frame-r.frame)<3))}`;
}
$('seek').oninput=draw;$('phase').onchange=draw;$('range').onchange=draw;$('play').onclick=()=>playing=!playing;setInterval(()=>{if(playing&&refs.length){$('seek').value=(+$('seek').value+1)%refs.length;draw()}},150);
</script></html>
